name: Release

# Builds the runtime's three parts from the pinned sources and this repository's patches:
#   x86_64    VKD3D-Proton's d3d12.dll + d3d12core.dll, and metalsharp/DXVK-MacOS's dxgi.dll, d3d11.dll, d3d10core.dll,
#             d3d9.dll, d3d8.dll built for x86_64 (x86_64-windows)
#   arm64     VKD3D-Proton's d3d12.dll + d3d12core.dll as ARM64X (aarch64-windows), which x86_64 programs load as
#             ARM64EC under FEX, with metalsharp/DXVK-MacOS's dxgi.dll, d3d11.dll, d3d10core.dll, d3d9.dll, d3d8.dll,
#             also ARM64X
#             (x86_64-windows, the folder MetalSharp Wine's VKD3D-Proton lane loads them from)
#   moltenvk  the universal libMoltenVK.dylib and its ICD file, with Apple's Metal Shader Converter library
# A pushed tag vX.Y publishes them as one release, vX.Y, with each part a package of its own.
# main and pull requests that change the build only build them (the archives are the run's artifacts).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/**'
      - 'patches/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  LLVM_MINGW_VERSION: '20261020'

jobs:
  dlls:
    name: ${{ matrix.lane }} DLLs
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        lane: [x86_64, arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          brew install meson ninja glslang zstd
          curl -fsSL -o "$RUNNER_TEMP/llvm-mingw.tar.xz" \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz"
          tar -xf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C "$RUNNER_TEMP"
          echo "LLVM_MINGW=$RUNNER_TEMP/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal" >> "$GITHUB_ENV"
          # fetch-sources.sh commits the patches it applies
          git config --global user.name "MetalSharp"
          git config --global user.email "metalsharp@users.noreply.github.com"

      - name: Sources
        run: bash scripts/fetch-sources.sh vkd3d-proton dxvk

      - name: Build
        run: |
          if [ "${{ matrix.lane }}" = x86_64 ]; then
            bash scripts/build-vkd3d-proton.sh
            bash scripts/build-dxvk.sh
          else
            bash scripts/build-vkd3d-proton-arm64x.sh
            bash scripts/build-dxvk-arm64x.sh
          fi

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          NAME="vkd3d-proton-$VERSION-${{ matrix.lane }}"
          ROOT="$RUNNER_TEMP/$NAME"
          # metalsharp/DXVK-MacOS's DXGI, D3D10/11 and D3D8/9 for x86_64 programs (they present VKD3D-Proton's swap
          # chains with its DXGI): built for x86_64 in the x86_64 lane and as ARM64X in the arm64 lane, from one source
          DXVK=dxvk
          [ "${{ matrix.lane }}" = x86_64 ] || DXVK=dxvk-arm64x
          mkdir -p "$ROOT/x86_64-windows"
          for dll in dxgi d3d11 d3d10core d3d9 d3d8; do cp artifacts/build/$DXVK/x86_64-windows/$dll.dll "$ROOT/x86_64-windows/"; done
          if [ "${{ matrix.lane }}" = x86_64 ]; then
            DIR="$ROOT/x86_64-windows"
            cp artifacts/build/vkd3d-proton/x86_64-windows/d3d12.dll artifacts/build/vkd3d-proton/x86_64-windows/d3d12core.dll "$DIR/"
          else
            DIR="$ROOT/aarch64-windows"
            mkdir -p "$DIR"
            cp artifacts/build/vkd3d-proton/aarch64-windows/d3d12.dll artifacts/build/vkd3d-proton/aarch64-windows/d3d12core.dll "$DIR/"
          fi
          cp sources/dxvk/LICENSE "$ROOT/LICENSE.dxvk"
          cp sources/dxvk/subprojects/dxbc-spirv/LICENSE "$ROOT/LICENSE.dxbc-spirv"
          git -C sources/dxvk describe --tags > "$ROOT/DXVK-VERSION"
          cp sources/vkd3d-proton/LICENSE "$ROOT/LICENSE.vkd3d-proton"
          cp LICENSE "$ROOT/LICENSE"
          # the lane's installer, run from the extracted package next to the extracted MoltenVK package
          cp install/install-common.sh "install/install-${{ matrix.lane }}-wine.sh" "$ROOT/"
          file "$ROOT"/*-windows/*.dll
          (cd "$ROOT" && find . -type f | LC_ALL=C sort | xargs shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -cf - "$NAME" | zstd -19 -q -o "dist/$NAME.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane }}
          path: dist/*.tar.zst
          if-no-files-found: error

  moltenvk:
    name: universal MoltenVK
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          # the newest installed Xcode: MoltenVK's macOS 26 features need its SDK
          X="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$X"
          xcodebuild -version
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK $SDK"
          [ "${SDK%%.*}" -ge 26 ] || { echo "MoltenVK needs the macOS 26 SDK or later, the runner's newest is $SDK" >&2; exit 1; }
          brew install zstd
          git config --global user.name "MetalSharp"
          git config --global user.email "metalsharp@users.noreply.github.com"

      - name: Sources
        run: bash scripts/fetch-sources.sh moltenvk

      - name: Build
        run: bash scripts/build-moltenvk.sh --externals

      - name: Metal Shader Converter
        run: bash scripts/fetch-metal-shaderconverter.sh

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || VERSION="$(git rev-parse --short HEAD)"
          NAME="moltenvk-$VERSION-universal"
          ROOT="$RUNNER_TEMP/$NAME"
          mkdir -p "$ROOT"
          cp artifacts/mvk-new/libMoltenVK.dylib artifacts/mvk-new/MoltenVK_icd.json "$ROOT/"
          cp sources/MoltenVK/LICENSE "$ROOT/LICENSE.MoltenVK"
          codesign -f -s - "$ROOT/libMoltenVK.dylib"
          # Apple's Metal Shader Converter, next to MoltenVK, which loads it: unmodified and keeping Apple's
          # signature, with its license and acknowledgements (scripts/fetch-metal-shaderconverter.sh)
          cp artifacts/metal-shaderconverter/libmetalirconverter.dylib artifacts/metal-shaderconverter/*.rtf "$ROOT/"
          ARCHS="$(lipo -archs "$ROOT/libMoltenVK.dylib")"
          echo "libMoltenVK.dylib: $ARCHS"
          case " $ARCHS " in *" arm64 "*) ;; *) echo "no arm64 slice" >&2; exit 1 ;; esac
          case " $ARCHS " in *" x86_64 "*) ;; *) echo "no x86_64 slice" >&2; exit 1 ;; esac
          (cd "$ROOT" && find . -type f | LC_ALL=C sort | xargs shasum -a 256 > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -cf - "$NAME" | zstd -19 -q -o "dist/$NAME.tar.zst"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: moltenvk
          path: dist/*.tar.zst
          if-no-files-found: error

  release:
    name: Releases
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dlls, moltenvk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          cat > notes.md <<EOF
          Built from $GITHUB_SHA. Each package holds its files, their licenses and SHA256SUMS.

          - **vkd3d-proton-$TAG-x86_64**: VKD3D-Proton's \`d3d12.dll\` and \`d3d12core.dll\`, with metalsharp/DXVK-MacOS's \`dxgi.dll\`, \`d3d11.dll\`, \`d3d10core.dll\`, \`d3d9.dll\` and \`d3d8.dll\` (DXVK 3.1.1 on MoltenVK), for x86_64 Windows programs (\`x86_64-windows\`). Stage them together.
          - **vkd3d-proton-$TAG-arm64**: for an arm64 Wine that runs x86_64 programs with FEX (MetalSharp Wine): VKD3D-Proton's \`d3d12.dll\` and \`d3d12core.dll\` as ARM64X (\`aarch64-windows\`, loaded by x86_64 programs as ARM64EC), with metalsharp/DXVK-MacOS's \`dxgi.dll\`, \`d3d11.dll\` and \`d3d10core.dll\`, also ARM64X (\`x86_64-windows\`, for x86_64 programs).
          - **moltenvk-$TAG-universal**: the universal (arm64 + x86_64), ad-hoc signed \`libMoltenVK.dylib\` and \`MoltenVK_icd.json\` both lanes run on, with Apple's Metal Shader Converter library (\`libmetalirconverter.dylib\`, unmodified, Apple-signed), which MoltenVK uses to convert DXIL compute, vertex and pixel shaders for VKD3D-Proton (\`METALSHARP_MSC=0\` turns it off).
          EOF
          gh release create "$TAG" dist/x86_64/*.tar.zst dist/arm64/*.tar.zst dist/moltenvk/*.tar.zst \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "VKD3D-Proton MacOS $TAG" --notes-file notes.md
