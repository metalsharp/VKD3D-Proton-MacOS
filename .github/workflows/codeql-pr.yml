name: CodeQL and shader CI (pull request)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: read

jobs:
  checks:
    name: Run CodeQL and shader checks
    uses: ./.github/workflows/codeql.yml
    # A called workflow gets at most what its caller job grants: codeql.yml asks for all four, and without
    # pull-requests the run fails at startup.
    permissions:
      contents: read
      security-events: write
      actions: read
      pull-requests: read
