# DXVK (DXGI, D3D10/11) settings for VKD3D-Proton macOS, read from the file DXVK_CONFIG_FILE names (the installer's
# env.sh points it here), else dxvk.conf in the program's working directory.

# MetalFX spatial upscaling of D3D11 swap chains, as in vkd3d.conf.
d3d11.metalSpatialUpscale = True

# DLSS (Super Resolution, Ray Reconstruction, Frame Generation) on MetalFX: the lane's NGX core and NVAPI answer only
# programs DXGI shows an NVIDIA GPU, so a game offers DLSS once this line is on. Set it per game, as other vendors'
# paths are what the rest of a game expects on a Mac:
# [Game.exe]
# dxgi.customVendorId = 10de
