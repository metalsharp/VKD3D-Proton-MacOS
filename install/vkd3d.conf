# VKD3D-Proton macOS settings, read from the file VKD3D_CONFIG_FILE names (the installer's env.sh points it here),
# else vkd3d.conf in the program's working directory. "key = value" lines; lines after a "[program.exe]" line apply
# to that program only. MetalSharp writes this file itself; other Wines use this one.

# MetalFX spatial upscaling of the swap chain to the display's size, where the game renders its swap chain smaller
# than its window (otherwise nothing changes). VKD3D_METALFX_SPATIAL=1 or 0 overrides it.
d3d12.metalSpatialUpscale = True
d3d11.metalSpatialUpscale = True
